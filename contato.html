    <main class="container my-5">
        <section>
            <h1>Fale com a Street Deck</h1>
            <p class="lead">Tem dúvida sobre algum produto ou quer fazer um pedido? Mande sua mensagem.</p>

            <div id="aviso"></div>

            <form id="form-contato" class="col-lg-6">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input type="text" id="nome" name="nome" class="form-control" placeholder="Digite seu nome" required minlength="3">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone (com DDD)</label>
                    <input type="text" id="telefone" name="telefone" class="form-control" placeholder="41999999999" required pattern="[0-9]{10,11}" title="Digite 10 ou 11 números, sem espaços ou traços">
                </div>

                <div class="mb-3">
                    <label for="assunto" class="form-label">Assunto</label>
                    <select id="assunto" name="assunto" class="form-select" required>
                        <option value="">Selecione um assunto</option>
                        <option value="duvida">Dúvida sobre produto</option>
                        <option value="pedido">Fazer um pedido</option>
                        <option value="troca">Troca ou devolução</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="mensagem" class="form-label">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" class="form-control" rows="5" placeholder="Escreva sua mensagem" required minlength="10"></textarea>
                </div>

                <input type="submit" value="Enviar mensagem" class="btn btn-laranja btn-lg">
            </form>
        </section>
    </main>
